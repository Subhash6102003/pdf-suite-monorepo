name: CI API
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: pnpm/action-setup@v2
      with:
        version: 9.0.0
    - uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'pnpm'
    - run: pnpm install
    - run: pnpm turbo run build --filter=api...
    - run: pnpm turbo run test --filter=api...
    - run: pnpm turbo run lint --filter=api...
