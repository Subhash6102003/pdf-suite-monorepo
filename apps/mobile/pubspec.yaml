name: pdf_suite
description: "PDF Suite Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.0.0
  go_router_builder: ^4.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  share_plus: ^7.0.0
  permission_handler: ^11.0.0
  connectivity_plus: ^6.0.0
  google_fonts: ^6.0.0
  pdfrx: ^1.0.0
  pdf: ^3.10.0
  image: ^4.1.0
  sentry_flutter: ^8.0.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
